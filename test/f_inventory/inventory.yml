# YAML format inventory, parsed via 'ansible-inventory'.
all:
  children:
    dev:
      hosts:
        debian.dev.local:
          dtap: dev
    prod:
      hosts:
        eek.electricmonk.nl:
        jib.electricmonk.nl:
          comment: Workstation
      vars:
        dtap: prod
    # Hosts nested under a child group, to check that membership of the
    # parent group is picked up too.
    infra:
      children:
        dbservers:
          hosts:
            deepdb01.dev.local:
      vars:
        tier: infra
